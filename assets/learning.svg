<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 88" width="1000" height="88" role="img" aria-label="LEARNING" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="2.5" result="b1"/>
  <feGaussianBlur stdDeviation="7" result="b2"/>
  <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="1.5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a0014"/><stop offset="1" stop-color="#b026ff" stop-opacity=".18"/></linearGradient><style>
.flick{animation:flick 5s infinite}
.flick2{animation:flick 7s infinite 1.3s}
@keyframes flick{0%,17%,21%,60%,63%,100%{opacity:1}19%,61.5%{opacity:.25}20%{opacity:.8}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.rain{animation:rain 1s linear infinite}
@keyframes rain{from{transform:translate(0,-30px)}to{transform:translate(-14px,420px)}}
.car{animation:car 10s linear infinite}
.car2{animation:car2 14s linear infinite}
@keyframes car{from{transform:translateX(-120px)}to{transform:translateX(1120px)}}
@keyframes car2{from{transform:translateX(1120px)}to{transform:translateX(-120px)}}
.win{animation:win 6s ease-in-out infinite}
@keyframes win{0%,100%{opacity:.95}50%{opacity:.12}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.sweep{animation:sweep 4s linear infinite}
@keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
