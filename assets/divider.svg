<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" width="1000" height="16" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="2.5" result="b1"/>
  <feGaussianBlur stdDeviation="7" result="b2"/>
  <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="1.5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2a6d"/><stop offset=".5" stop-color="#b026ff"/><stop offset="1" stop-color="#05d9e8"/></linearGradient><linearGradient id="spark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><style>.mv{animation:mv 3.5s linear infinite}@keyframes mv{from{transform:translateX(-120px)}to{transform:translateX(1020px)}}</style></defs><line x1="0" y1="8" x2="1000" y2="8" stroke="url(#g)" stroke-width="3" filter="url(#glow)"/><rect class="mv" x="0" y="6" width="120" height="4" rx="2" fill="url(#spark)"/></svg>